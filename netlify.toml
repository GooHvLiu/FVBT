[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--no-audit --no-fund"

# 静态页面已经预渲染，未命中的地址统一落到 404 页面
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
